[package]
name = "r1-panel"
version = "0.1.0"
edition = "2021"
description = "HS-NAS-R1 Panel — native Rust DRM/KMS software renderer"

[dependencies]
libc = "0.2"

# Concurrency & signals
ctrlc = "3.4"

# Logging
log = "0.4"
env_logger = "0.11"

# Antialiased TrueType rendering. The font itself is loaded from the host.
fontdue = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"     # optimize for size
lto = true
strip = true
codegen-units = 1
