[package]
name = "r1-panel"
version = "0.1.0"
edition = "2021"
description = "HS-NAS-R1 Panel — Rust + LVGL native DRM rendering"

[dependencies]
# System
libc = "0.2"
nix = { version = "0.29", features = ["fs", "ioctl", "net"] }

# DRM / KMS
drm = "0.14"

# Concurrency & signals
ctrlc = "3.4"

# CPU count
num_cpus = "1"

# JSON (Docker API)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
log = "0.4"
env_logger = "0.11"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = "s"     # optimize for size
lto = true
strip = true
codegen-units = 1
