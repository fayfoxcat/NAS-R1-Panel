name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-lvgl-panel

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust musl toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
          components: rustfmt

      - name: Install musl linker
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Test
        run: cargo test --locked --target x86_64-unknown-linux-musl

      - name: Build static release
        run: cargo build --locked --release --target x86_64-unknown-linux-musl

      - name: Prepare release files
        run: |
          cp target/x86_64-unknown-linux-musl/release/r1-panel ../r1-panel
          cd ..
          sha256sum r1-panel > r1-panel.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            r1-panel
            r1-panel.sha256
          body: |
            HS-NAS-R1 Panel ${{ github.ref_name }}

            ```bash
            curl -fsSL https://raw.githubusercontent.com/fayfoxcat/HS-NAS-R1-Panel/master/install.sh | sudo bash
            ```
